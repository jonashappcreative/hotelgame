name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Lint skipped — 117 pre-existing errors; add back once codebase is cleaned up
      # - name: Lint
      #   run: npm run lint

      # Uncomment once vitest worker-spawn bug is fixed (pin to vitest 4.0.0 or 3.x)
      # - name: Test
      #   run: npm run test:run

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: ci
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify deploy
        run: |
          STATUS=$(curl -s -o /tmp/coolify_response.txt -w "%{http_code}" \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "HTTP status: $STATUS"
          echo "Response body: $(cat /tmp/coolify_response.txt)"
          echo "$STATUS" | grep -q "^2" || exit 1
